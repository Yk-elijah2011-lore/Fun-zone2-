<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="cabinet"><section class="screen content-screen">
     <p style="color: darkmagenta;">Math</p>
        <h1 class="content-heading">VIDEO ZONE</h1>
        <label class="video-upload" for="videoInput">INSERT VIDEO</label>
        <input id="videoInput" class="file-input" type="file" accept="video/*">
        <div class="video-space" id="videoSpace" role="region" aria-label="Video space">
            <span>VIDEO GOES HERE</span>
            <video id="videoPreview" class="video-preview" controls aria-label="Your selected video preview"></video>
        </div>
        <p class="hint">CHOOSE A VIDEO FROM YOUR COMPUTER</p>
        <nav class="pager"><a href="index.html">◀ BACK</a>
    </section></main>
    <script>
        const videoInput = document.querySelector("#videoInput");
        const videoSpace = document.querySelector("#videoSpace");
        const videoPreview = document.querySelector("#videoPreview");

        videoInput.addEventListener("change", () => {
            const video = videoInput.files[0];
            if (!video) return;
            videoPreview.src = URL.createObjectURL(video);
            videoSpace.classList.add("has-video");
        });
    </script>
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSKWyD3bxc-hHfF3wYUyN1LqiOXhYC_FOER30FR6qhB4-5DkqgZAsDQneTeJoswga2x2D6CLOZNUMQJ/pubhtml?widget=true&amp;headers=false"></iframe>
</body>
</html>
